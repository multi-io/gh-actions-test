name: OpenStack Integration Dump Vars

on:
  push:
    branches: [ main ]
  # pull_request_target runs in the base repo context, so secrets are available
  # on fork PRs after environment approval. Checkout uses the PR head so the
  # job runs the contributor's code; only approve after reviewing the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_dispatch:

jobs:
  dumpvars:
    runs-on: ubuntu-latest
    environment: openstack-integration

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Dump environment values
        env:
          MY_REPO_VAR: ${{ vars.MY_REPO_VAR }}
          MY_REPO_SECRET: ${{ secrets.MY_REPO_SECRET }}
          MY_ENV_VAR: ${{ vars.MY_ENV_VAR }}
          MY_ENV_SECRET: ${{ secrets.MY_ENV_SECRET }}
        run: ./dumpvars.sh openstack-integration
